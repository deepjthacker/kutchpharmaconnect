<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kutch PharmaConnect</title>
  <desc id="desc">Kutch PharmaConnect, Kutch's Pharmaceutical and Healthcare Directory</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f73d1"/>
      <stop offset="100%" stop-color="#22a65a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0b2144" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(18 18)" filter="url(#soft)">
    <circle cx="142" cy="142" r="118" fill="#f7fbff" stroke="url(#ring)" stroke-width="12"/>
    <!-- Abstract Kutch / connected territory -->
    <path d="M83 92c17-22 39-36 63-44 18-6 33-2 45 8 9 8 17 8 30 5 13-3 28 5 31 17 3 12-4 22-2 33 3 15 17 20 22 31 6 13-3 30-18 36-16 6-25 16-31 29-7 15-18 26-33 28-14 2-27-4-38-1-11 3-17 15-31 17-14 2-31-7-42-16-11-9-27-12-37-24-10-12-5-25 4-36 8-11 1-27 4-38 3-10 13-16 33-45z" fill="#1f73d1" opacity=".98"/>
    <path d="M83 92c17-22 39-36 63-44 18-6 33-2 45 8 9 8 17 8 30 5 13-3 28 5 31 17 3 12-4 22-2 33 3 15 17 20 22 31 6 13-3 30-18 36-16 6-25 16-31 29-7 15-18 26-33 28-14 2-27-4-38-1-11 3-17 15-31 17-14 2-31-7-42-16-11-9-27-12-37-24-10-12-5-25 4-36 8-11 1-27 4-38 3-10 13-16 33-45z" fill="none" stroke="#9fd0ff" stroke-width="2" opacity=".65"/>

    <!-- Medical cross -->
    <rect x="91" y="98" width="103" height="103" rx="21" fill="#ffffff" opacity=".96"/>
    <path d="M130 111h25v28h28v25h-28v28h-25v-28h-28v-25h28z" fill="#1f73d1"/>

    <!-- Capsule -->
    <g transform="rotate(-40 148 150)">
      <rect x="131" y="111" width="30" height="75" rx="15" fill="#25a95a"/>
      <path d="M131 148.5h30v22.5h-30z" fill="#1f73d1"/>
    </g>

    <!-- Location pin -->
    <path d="M208 55c0-27 22-49 49-49s49 22 49 49c0 39-49 82-49 82s-49-43-49-82z" fill="#24a85a"/>
    <circle cx="257" cy="54" r="17" fill="#ffffff"/>
    <circle cx="257" cy="54" r="8" fill="#24a85a"/>

    <!-- Connection swoosh -->
    <path d="M48 228c79 40 166 31 235-27 20-17 33-35 42-55" fill="none" stroke="#24a85a" stroke-width="16" stroke-linecap="round"/>
    <path d="M52 244c85 28 168 10 225-42" fill="none" stroke="#1f73d1" stroke-width="7" stroke-linecap="round" opacity=".9"/>

    <!-- Connected nodes -->
    <g fill="#24a85a">
      <circle cx="53" cy="249" r="8"/>
      <circle cx="76" cy="256" r="7"/>
      <circle cx="98" cy="257" r="6"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(338 54)">
    <text x="0" y="82" font-size="86" font-weight="800" letter-spacing="-2.5" fill="#173a8f" font-family="Inter,Segoe UI,Arial,sans-serif">Kutch</text>
    <text x="0" y="158" font-size="74" font-weight="800" letter-spacing="-2.2" fill="#1f73d1" font-family="Inter,Segoe UI,Arial,sans-serif">Pharma<tspan fill="#24a85a">Connect</tspan></text>
    <line x1="3" y1="188" x2="62" y2="188" stroke="#24a85a" stroke-width="5" stroke-linecap="round"/>
    <text x="78" y="196" font-size="25" font-weight="600" fill="#65758b" font-family="Inter,Segoe UI,Arial,sans-serif">Kutch's Pharmaceutical &amp; Healthcare Directory</text>
    <line x1="760" y1="188" x2="818" y2="188" stroke="#24a85a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>